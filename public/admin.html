<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · 夜神月博客</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .admin { max-width: 920px; margin: 0 auto; padding: 30px 20px 80px; }
    .panel { margin-bottom: 26px; }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .field label { font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700; }
    input, textarea, select { font-family:inherit; font-size:15px; padding:10px; border:3px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
    [data-theme="dark"] input, [data-theme="dark"] textarea, [data-theme="dark"] select { background:var(--page); }
    textarea { min-height:180px; resize:vertical; font-family:"JetBrains Mono",monospace; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .login-box { max-width:380px; margin:12vh auto; }
    .list-item { display:flex; justify-content:space-between; gap:10px; align-items:center; border:3px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px; background:#fff; }
    [data-theme="dark"] .list-item { background:var(--page); }
    .mini { padding:6px 12px; font-size:13px; box-shadow:3px 3px 0 var(--shadow); }
    .del { background:var(--pink); color:#fff; }
    .hint { font-family:"JetBrains Mono",monospace; font-size:12px; opacity:.7; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .tabs button { cursor:pointer; font-family:"JetBrains Mono",monospace; font-weight:700; border:3px solid var(--line); border-radius:8px; padding:8px 14px; background:transparent; }
    .tabs button.on { background:var(--lime); }
    .hidden { display:none; }
    .ok { color:#0a7d2c; font-family:"JetBrains Mono",monospace; font-size:13px; }
    .err { color:#c0143c !important; }
    .field label::after { content:""; }
    #saveMsg[class="hint err"] { color:#c0143c; }
  
    .stats-bar { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    .sb-item { display:flex; flex-direction:column; align-items:center; min-width:70px; }
    .sb-item b { font-size:22px; font-family:"JetBrains Mono",monospace; }
    .sb-item span { font-size:11px; color:var(--ink-2,#666); }
    .sb-dist { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
    .sb-chip { font-size:11px; border:2px solid var(--line,#0A0A0A); border-radius:999px; padding:2px 8px; }
    .sb-chip b { font-family:"JetBrains Mono",monospace; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand"><span>⚙ 夜神月博客 · 后台</span></div>
    <div class="row">
      <a class="btn ghost mini" href="/" target="_blank" rel="noopener">查看前台</a>
      <button class="btn ghost mini" id="logout">退出</button>
      <button class="theme-toggle" id="themeBtn" aria-label="切换主题">🌙</button>
    </div>
  </nav>

  <!-- 登录 -->
  <div class="admin" id="loginView">
    <div class="card login-box">
      <h2 style="margin-top:0">管理员登录</h2>
      <div class="field">
        <label>密码</label>
        <input type="password" id="passInput" placeholder="输入管理员密码" />
      </div>
      <button class="btn" id="loginBtn" style="width:100%">登 录</button>
      <p class="hint" id="loginMsg"></p>
    </div>
  </div>

  <!-- 管理主区 -->
  <div class="admin hidden" id="dashView">
    <div class="tabs">
      <button data-tab="posts" class="on">文章管理</button>
      <button data-tab="drive">资源网盘</button>
      <button data-tab="gallery">照片墙</button>
      <button data-tab="comments">留言管理</button>
      <button data-tab="visitors">访客与安全</button>
      <button data-tab="site">站点设置</button>
      <button data-tab="pwd">修改密码</button>
    </div>
    <p class="ok" id="saveMsg"></p>

    <!-- 文章 -->
    <div class="panel" id="tab-posts">
      <div class="card stats-bar" id="statsBar" style="margin-bottom:14px"></div>
      <div class="row" style="margin-bottom:14px">
        <button class="btn" id="newPost">+ 写新文章</button>
        <button class="btn alt" id="backupBtn">⬇ 下载整站备份</button>
        <span class="hint">共 <span id="postCount">0</span> 篇</span>
      </div>
      <div id="postList"></div>

      <div class="card hidden" id="postForm" style="margin-top:18px">
        <h3 style="margin-top:0">文章编辑</h3>
        <div class="field"><label>标题 *</label><input id="f_title" /></div>
        <div class="row">
          <div class="field" style="flex:1"><label>栏目</label><select id="f_cat"></select></div>
          <div class="field"><label>日期</label><input id="f_date" type="date" /></div>
          <div class="field"><label>精选</label><input id="f_feat" type="checkbox" style="width:auto;height:24px" /></div>
        </div>
        <div class="field"><label>slug（URL 标识，可留空自动生成）</label><input id="f_slug" placeholder="my-post" /></div>
        <div class="field"><label>标签（逗号分隔）</label><input id="f_tags" placeholder="ESP32, MQTT" /></div>
        <div class="field"><label>摘要</label><textarea id="f_excerpt" style="min-height:70px"></textarea></div>
        <div class="field">
          <label>配图（可选，单张 ≤ 4MB，自动插入正文末尾）</label>
          <div class="row">
            <input type="file" id="f_img" accept="image/*" style="flex:1" />
            <button class="btn mini" id="uploadImg" type="button">上传并插入</button>
          </div>
        </div>
        <div class="field"><label>正文（支持 Markdown）</label><textarea id="f_content"></textarea></div>
        <div class="row" style="margin-top:6px">
          <button class="btn" id="savePost">保存文章</button>
          <button class="btn ghost" id="cancelPost">取消</button>
        </div>
        <input type="hidden" id="f_id" />
      </div>
    </div>

    <!-- 站点 -->
    <div class="panel hidden" id="tab-site">
      <div class="field"><label>站点标题</label><input id="s_title" /></div>
      <div class="field"><label>Slogan（标语）</label><input id="s_slogan" /></div>
      <div class="field"><label>关于我</label><textarea id="s_about" style="min-height:120px"></textarea></div>
      <div class="field"><label>技术栈（逗号分隔）</label><input id="s_tech" /></div>
      <div class="field"><label>标签池（逗号分隔）</label><textarea id="s_tags" style="min-height:70px"></textarea></div>
      <div class="field"><label>联系方式 · 邮箱</label><input id="s_email" /></div>
      <div class="field"><label>联系方式 · GitHub</label><input id="s_github" /></div>
      <div class="field"><label>开源项目（每行一个：名称|URL|描述）</label><textarea id="s_projects" style="min-height:90px"></textarea></div>
      <div class="field"><label>友链（每行一个：名称|URL|描述）</label><textarea id="s_links" style="min-height:70px"></textarea></div>
      <h3>栏目管理</h3>
      <div id="catList"></div>
      <div class="card" style="margin-top:10px">
        <div class="row">
          <input id="c_name" placeholder="栏目名" style="flex:1" />
          <select id="c_icon">
            <option value="chip">chip</option><option value="wave">wave</option>
            <option value="cloud">cloud</option><option value="bug">bug</option>
            <option value="solder">solder</option>
          </select>
          <input id="c_desc" placeholder="描述" style="flex:2" />
          <button class="btn mini" id="addCat">+ 加栏目</button>
        </div>
      </div>
      <button class="btn" id="saveSite" style="margin-top:16px">保存站点设置</button>
    </div>

    <!-- 资源网盘 -->
    <div class="panel hidden" id="tab-drive">
      <div class="card" style="padding:16px;margin-bottom:16px">
        <div class="field"><label>上传到目录（相对路径，如 01-嵌入式基础，留空为根目录）</label><input id="d_dir" placeholder="01-嵌入式基础" /></div>
        <div class="field"><label>选择文件（单文件 ≤ 30MB，支持 md / pdf / zip / 源码 / 图片等）</label>
          <div class="row"><input type="file" id="d_file" style="flex:1" /><button class="btn mini" id="d_upload" type="button">上传</button></div>
        </div>
        <div class="row">
          <input id="d_newdir" placeholder="新建目录名（如 08-调试笔记）" style="flex:1" />
          <button class="btn mini alt" id="d_mkdir" type="button">+ 新建目录</button>
        </div>
        <p class="hint">前台入口：导航栏「网盘」或直接访问 <a href="/#/drive" target="_blank" rel="noopener">/#/drive</a> · 访客需输入访问口令解锁</p>
      </div>
      <div class="card" style="padding:16px;margin-bottom:16px;border-left:6px solid #d97706">
        <b>🔒 网盘访问口令</b>
        <p class="hint">修改后所有已解锁访客立即失效，需用新口令重新解锁。初始口令：iot-2026</p>
        <div class="row">
          <input type="password" id="d_pass" placeholder="新访问口令（至少 4 位）" style="flex:1" autocomplete="new-password" />
          <button class="btn mini" id="d_savepass" type="button">修改口令</button>
        </div>
        <p class="hint" id="d_passmsg"></p>
      </div>
      <div class="row" style="margin-bottom:10px">
        <b>网盘文件</b>
        <span class="hint" id="d_stat"></span>
        <button class="btn ghost mini" id="d_refresh" style="margin-left:auto">↻ 刷新</button>
      </div>
      <div id="d_list"></div>
    </div>

    <!-- 照片墙管理 -->
    <div class="panel hidden" id="tab-gallery">
      <div class="card" style="padding:16px;margin-bottom:16px">
        <div class="field"><label>图片地址（/img/… 或 /uploads/… 或 https://…）</label><input id="g_src" placeholder="/uploads/xxx.jpg" /></div>
        <div class="row">
          <div class="field" style="flex:1"><label>标题</label><input id="g_title" placeholder="照片标题" /></div>
          <div class="field" style="flex:1"><label>角标说明（可选）</label><input id="g_cap" placeholder="「一句话」" /></div>
        </div>
        <div class="row">
          <div class="field" style="flex:1"><label>旋转角度（-10 ~ 10）</label><input id="g_rot" type="number" min="-10" max="10" value="0" /></div>
          <div class="field" style="flex:1"><label>胶带颜色</label>
            <select id="g_tape"><option value="pink">粉色</option><option value="mint">薄荷</option><option value="amber">琥珀</option><option value="violet">紫色</option><option value="sky">天蓝</option></select>
          </div>
          <div class="field" style="align-self:end"><button class="btn mini" id="g_save" type="button">保存照片</button></div>
        </div>
        <p class="hint" id="g_msg"></p>
      </div>
      <div class="row" style="margin-bottom:10px">
        <b>墙上的照片</b><span class="hint" id="g_count"></span>
        <button class="btn ghost mini" id="g_refresh" style="margin-left:auto">↻ 刷新</button>
      </div>
      <div id="g_list"></div>
    </div>

    <!-- 留言管理 -->
    <div class="panel hidden" id="tab-comments">
      <div class="row" style="margin-bottom:10px">
        <b>全部留言</b><span class="hint" id="cm_count"></span>
        <button class="btn ghost mini" id="cm_refresh" style="margin-left:auto">↻ 刷新</button>
      </div>
      <div id="cm_list"></div>
    </div>

    <!-- 访客与安全 -->
    <div class="panel hidden" id="tab-visitors">
      <div class="card stats-bar" id="v_stats" style="margin-bottom:14px"></div>
      <div class="row" style="margin-bottom:8px">
        <b>🚫 IP 黑名单</b>
        <button class="btn ghost mini" id="v_refresh" style="margin-left:auto">↻ 刷新</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <input id="v_ip" placeholder="封禁 IP（如 203.0.113.7）" style="flex:1" />
        <button class="btn mini" id="v_ban" type="button">拉黑</button>
      </div>
      <div id="v_banlist" style="margin-bottom:16px"></div>
      <b>👀 可疑 IP（登录 / 解锁失败自动记录）</b>
      <div id="v_watch" style="margin:10px 0 16px"></div>
      <b>🕒 最近访客</b>
      <div id="v_recent" style="margin-top:10px"></div>
    </div>

    <!-- 密码 -->
    <div class="panel hidden" id="tab-pwd">      <div class="field"><label>当前密码</label><input type="password" id="p_cur" /></div>
      <div class="field"><label>新密码</label><input type="password" id="p_new" /></div>
      <div class="field"><label>确认新密码</label><input type="password" id="p_new2" /></div>
      <button class="btn" id="savePwd">修改密码</button>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
